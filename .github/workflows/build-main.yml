name: Node.js Automated Build on Main

# Memicu otomatisasi hanya ketika ada push ke branch main
on:
  push:
    branches:
      - main

jobs:
  build-project:
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Mengambil kode terbaru dari repositori ke runner GitHub
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Langkah 2: Setup versi Node.js di server virtual GitHub
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-node-version: '20' # Anda bisa mengubah versi ini sesuai dengan versi Node.js proyek Anda
          cache: 'npm'           # Mengaktifkan cache agar proses install berikutnya lebih cepat

      # Langkah 3: Mengunduh dependensi (node_modules) berdasarkan package-lock.json
      - name: Install dependencies
        run: npm ci

      # Langkah 4: Menjalankan proses build utama
      - name: Run project build
        run: npm run build
