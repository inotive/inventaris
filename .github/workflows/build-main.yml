name: Deploy to Hostinger Shared Hosting

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Project
        run: npm run build

      # PROSES DEPLOY VIA FTP KE HOSTINGER
      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Folder hasil build di server virtual GitHub
          local-dir: ./public/build/ 
          
          # Folder tujuan di Hostinger (karena akun FTP dikunci di folder proyek Sinergi)
          server-dir: ./public/build/ 
          
          # Membersihkan file build lama di Hostinger secara aman
          dangerous-clean-html: true
